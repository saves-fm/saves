# saves.fm API. Bindings (D1, R2, KV, Queues) arrive with #4 and secrets with
# #7. Deploy with --env staging or --env production; main deploys to staging
# automatically and every PR gets a preview URL (.github/workflows/deploy.yml).
name = "saves-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# Workers Observability: logs and metrics in the Cloudflare dashboard
[observability]
enabled = true

[env.staging]
name = "saves-api-staging"
[env.staging.observability]
enabled = true

[env.production]
name = "saves-api"
[env.production.observability]
enabled = true
