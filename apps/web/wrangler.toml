# saves.fm web app, served as a Worker with static assets (the Vite build).
# Deploy with --env staging or --env production after `pnpm build`; main
# deploys to staging automatically and every PR gets a preview URL.
name = "saves-web"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[env.staging]
name = "saves-web-staging"

[env.production]
name = "saves-web"
