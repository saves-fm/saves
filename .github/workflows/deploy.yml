name: Deploy

# Pushes to main deploy the web app and API to staging. Every PR from this
# repo uploads a preview version of both (no traffic moves) at a stable URL,
# pr-<number>-saves-{web,api}-staging.<subdomain>.workers.dev, and comments
# the links on the PR. Production deploys come with the launch (v1.0.0).
#
# Needs the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID
# variable (see docs/deploying.md). PRs from forks can't read secrets, so
# they get CI but no preview.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: ${{ github.event_name == 'push' && 'Staging' || 'PR preview' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # the preview comment
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare access
        id: access
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Skipping deploy: set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable (docs/deploying.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.access.outputs.ready == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.access.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.access.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install and build
        if: steps.access.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile && pnpm --filter @saves/web build

      - name: Deploy staging
        if: steps.access.outputs.ready == 'true' && github.event_name == 'push'
        run: |
          pnpm --filter @saves/api exec wrangler deploy --env staging
          pnpm --filter @saves/web exec wrangler deploy --env staging

      - name: Upload PR previews
        id: preview
        if: steps.access.outputs.ready == 'true' && github.event_name == 'pull_request'
        env:
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          url() { grep -o 'Version Preview Alias URL: https://[^ ]*' | sed 's/.*: //'; }
          api=$(pnpm --filter @saves/api exec wrangler versions upload --env staging --preview-alias "$ALIAS" --message "PR #${ALIAS#pr-}" 2>&1 | tee /dev/stderr | url)
          web=$(pnpm --filter @saves/web exec wrangler versions upload --env staging --preview-alias "$ALIAS" --message "PR #${ALIAS#pr-}" 2>&1 | tee /dev/stderr | url)
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

      - name: Comment the preview links
        if: steps.preview.outputs.web != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body=$(printf '**Preview for this PR** (updates on every push)\n\n| | |\n|---|---|\n| Web | %s |\n| API | %s/v1/health |\n\nBuilt from %s.' \
            "${{ steps.preview.outputs.web }}" "${{ steps.preview.outputs.api }}" "${SHA:0:7}")
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$body" --edit-last --create-if-none
